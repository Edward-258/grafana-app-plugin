services:
  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DEFAULT_APP_MODE: development
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: 'true'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: local-ecs-app,local-ecs-app-ds
      # 加密 grafana.db 里 secure_json_data（AK/SK）的密钥，取自同目录 .env（不入库）；
      # 留空时 Grafana 用公开默认密钥（CI 即此情形：临时容器、无真实 AK，无风险）
      GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY:-}
      GF_LOG_LEVEL: info
      GF_LOG_FILTERS: plugin.local-ecs-app:debug
    # Docker Desktop 内嵌 DNS 的默认上游（WSL2 宿主链）对阿里云 API 域名的并发解析
    # 随机 SERVFAIL（server misbehaving），33 地域扇出几乎必挂；显式指到公网 DNS 根治
    dns:
      - 223.5.5.5
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dist:/var/lib/grafana/plugins/local-ecs-app
      - ./provisioning:/etc/grafana/provisioning

# grafana.db 等状态存进命名卷，容器重建（up --force-recreate / down+up）不丢库；
# 只有 docker compose down -v 才会删卷。dist 覆盖挂载优先级更高，不受影响。
volumes:
  grafana-data:

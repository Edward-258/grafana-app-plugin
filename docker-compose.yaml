services:
  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DEFAULT_APP_MODE: development
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: local-ecs-app
      GF_LOG_LEVEL: info
      GF_LOG_FILTERS: plugin.local-ecs-app:debug
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dist:/var/lib/grafana/plugins/local-ecs-app
      - ./provisioning:/etc/grafana/provisioning

# grafana.db 等状态存进命名卷，容器重建（up --force-recreate / down+up）不丢库；
# 只有 docker compose down -v 才会删卷。dist 覆盖挂载优先级更高，不受影响。
volumes:
  grafana-data:

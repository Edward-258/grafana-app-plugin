# 临时验证用：匿名 Viewer 视角的 Grafana 实例（端口 3001），验证 RBAC 拦截。
# 用法：docker compose -f docker-compose.yaml -f docker-compose.viewer.yaml up -d grafana-viewer
# 验证完：docker compose -f docker-compose.yaml -f docker-compose.viewer.yaml down grafana-viewer
services:
  grafana-viewer:
    image: grafana/grafana:11.6.0
    ports:
      - '3001:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_DEFAULT_APP_MODE: development
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: local-ecs-app
      GF_LOG_LEVEL: info
      GF_FEATURE_TOGGLES_ENABLE: externalServiceAccounts
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: 'true'
    volumes:
      - ./dist:/var/lib/grafana/plugins/local-ecs-app
      - ./provisioning:/etc/grafana/provisioning
